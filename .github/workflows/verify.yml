name: Verify

on:
  pull_request:
    branches:
      - main

# A PR that gets superseded by a new push doesn't need its old build finished.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    # Cap the job so a wedged build can't run for the default 6h.
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Deliberately runs the `verify` script rather than spelling out
      # lint/typecheck/build as separate steps: AGENTS.md makes `npm run verify`
      # the contract for "is this done", and the Husky pre-push hook runs the
      # same script. One definition in package.json, so CI can't drift from what
      # contributors run locally.
      #
      # No secrets are passed on purpose. The production image supplies env vars
      # as Docker build args, but the build does not require them — and secrets
      # are withheld from fork PRs (and scoped separately for Dependabot), so a
      # job that depended on them would silently behave differently for exactly
      # the PRs this gate exists to check. Keeping it env-free means every PR
      # gets the identical check.
      - name: Verify (lint, typecheck, build)
        run: npm run verify
